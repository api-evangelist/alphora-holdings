name: Alphora Holdings
description: 'Alphora (Alphora GmbH / Alphora Holdings) is a Berlin-based, AI-native managed IT
  services company founded in 2025 and backed by Northzone at the seed stage. Its agentic platform
  runs IT operations end-to-end for businesses and managed service providers (MSPs) — an integrated
  IT service desk, managed compliance and documentation, managed AI delivered by forward-deployed
  engineers, endpoint cybersecurity, user and hardware provisioning, and 24/7 network and cloud
  monitoring — pairing centralized intelligence with local execution across a shared data lake. The
  company operates alphora-it.com with a marketing site and active careers portal but does not yet
  expose a public API, developer portal, SDKs, or machine-readable API specifications.'
